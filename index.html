<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประกาศองค์กร - Kenan Connect</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --green:#06C755; --ink:#1b1b1b; --muted:#777; --line:#e6e6e6; --bg:#f7f7f7; --navy:#0b4a7a; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system, Helvetica, Arial, sans-serif; margin:0; background:var(--bg); color:var(--ink); }
  a { color:inherit; text-decoration:none; }

  .topbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
            display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .topbar .back { width:34px; height:34px; border:none; background:transparent; border-radius:9px; cursor:pointer;
                  display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .topbar .back:hover { background:#f0f0f0; }
  .topbar .back svg { width:20px; height:20px; }
  .topbar .ttl { display:flex; flex-direction:column; line-height:1.15; }
  .topbar .ttl .title { font-size:16px; font-weight:bold; color:var(--green); }
  .topbar .ttl .sub { font-size:11px; color:var(--muted); }

  .wrap { max-width:720px; margin:0 auto; padding:16px; }

  #status { margin:0 0 12px; padding:12px; border-radius:8px; font-size:14px; display:none; white-space:pre-line; }
  .ok { background:#d4edda; color:#155724; }
  .err { background:#f8d7da; color:#721c24; }
  #checkingBox { padding:14px; border-radius:8px; font-size:14px; background:#eee; color:#555; }

  .ann { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .ann .a-title { font-size:16px; font-weight:bold; }
  .ann .a-meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .ann .a-body { font-size:14px; color:#333; margin-top:10px; line-height:1.55; white-space:pre-line; }
  .emptyMsg { color:#999; font-size:14px; text-align:center; padding:28px 10px; }

  #loginBox { display:none; padding:16px; border-radius:10px; background:#fff; border:1px solid var(--line); }
  #loginBox b { font-size:15px; }
  #loginBox p { font-size:13px; color:var(--muted); }
  #loginBox button { width:100%; padding:12px; font-size:15px; border:none; border-radius:8px; margin-top:10px;
                     color:#fff; font-weight:bold; cursor:pointer; background:var(--green); }
  #manualEntryBox { margin-top:12px; padding:12px; border-radius:8px; font-size:13px; background:#f0f0f0; color:#333; }
  #manualEntryBox input { width:100%; padding:10px; font-size:14px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; }
  #manualEntryBox button { width:100%; background:#666; margin-top:8px; }
  .tiny { font-size:11px; color:var(--muted); }
  #idFoot { margin:20px 0; font-size:11px; color:#aaa; word-break:break-all; text-align:center; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="back" onclick="goHub()" aria-label="Back to hub" title="กลับหน้าหลัก">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="ttl">
      <span class="title">ประกาศองค์กร</span>
      <span class="sub">Announcements</span>
    </div>
  </div>

  <div class="wrap">
    <div id="status"></div>
    <div id="checkingBox">กำลังตรวจสอบสถานะการเข้าสู่ระบบ...</div>

    <div id="loginBox">
      <b>เข้าสู่ระบบด้วย LINE</b>
      <p>เข้าสู่ระบบเพื่อดูประกาศองค์กร</p>
      <button type="button" id="manualLoginBtn" onclick="doManualLogin()">เข้าสู่ระบบ LINE (กดครั้งเดียว)</button>
      <div id="manualEntryBox">
        <b>เข้าใช้งานแบบไม่พึ่ง LIFF (ถ้ากดล็อกอิน LINE ข้างบนไม่สำเร็จ)</b>
        <p class="tiny" style="margin:6px 0;">แชทกับ Kenan Connect OA แล้วพิมพ์ "ขอสิทธิ์" เพื่อรับรหัสผู้ใช้ LINE ของคุณ จากนั้นวางรหัสในช่องด้านล่าง</p>
        <input type="text" id="manualUidInput" placeholder="เช่น Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
        <button type="button" onclick="useManualUid()">ใช้รหัสนี้</button>
        <div id="manualEntryMsg" class="tiny"></div>
      </div>
    </div>

    <div id="listArea" style="display:none;">
      <div id="annList"></div>
    </div>

    <div id="idFoot"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzMzOnY7z76qPTY0HXLKGOsJpJStszSmJ57_Rgo7WyRGQ0Q-K8vdQj531B-_yUYRwUa/exec';
    const LIFF_ID = '2010937586-a4GJnU8o'; // shared channel LIFF ID (reused, same as kenan-parcel / kenan-call-tree)
    const HUB_URL = 'https://kenan-foundation-asia.github.io/kenan-hub/';

    let currentUid = '';

    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function setId(msg){ const el=document.getElementById('idFoot'); if(el) el.textContent = msg; }
    function goHub(){ window.location.href = HUB_URL; }
    function showStatus(ok, message){
      const el=document.getElementById('status'); if(!el) return;
      el.style.display='block'; el.className = ok?'ok':'err'; el.textContent = message;
    }

    // GAS web app บางครั้งตอบเป็นหน้า HTML ชั่วคราวถ้ายิงหลาย request พร้อมกัน (concurrency) - ลองใหม่อัตโนมัติ
    async function callApiGet(params, retries){
      if (retries === undefined) retries = 2;
      const url = new URL(SCRIPT_URL);
      url.searchParams.set('format','json');
      Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
      const res = await fetch(url.toString());
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        if (retries > 0) {
          await new Promise(r => setTimeout(r, 400));
          return callApiGet(params, retries - 1);
        }
        throw new Error('เซิร์ฟเวอร์ตอบไม่ถูกต้อง (ลองใหม่แล้วไม่สำเร็จ)');
      }
    }

    function formatDate(iso){
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      try {
        return d.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }) +
               ' ' + d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
      } catch (e) { return d.toISOString().slice(0,16).replace('T',' '); }
    }

    async function loadAnnouncements(){
      const el = document.getElementById('annList');
      el.innerHTML = '<div class="emptyMsg">กำลังโหลด...</div>';
      try {
        const data = await callApiGet({ action:'getAnnouncements', uid: currentUid });
        const list = data.announcements || [];
        if (!list.length) { el.innerHTML = '<div class="emptyMsg">ยังไม่มีประกาศ<br>No announcements yet</div>'; return; }
        el.innerHTML = '';
        list.forEach(a => {
          const card = document.createElement('div');
          card.className = 'ann';
          const meta = [formatDate(a.date), a.postedBy ? ('โดย ' + escapeHtml(a.postedBy)) : ''].filter(Boolean).join(' · ');
          card.innerHTML =
            '<div class="a-title">' + escapeHtml(a.title) + '</div>' +
            '<div class="a-meta">' + meta + '</div>' +
            (a.body ? '<div class="a-body">' + escapeHtml(a.body) + '</div>' : '');
          el.appendChild(card);
        });
      } catch (e) {
        el.innerHTML = '<div class="emptyMsg">โหลดไม่สำเร็จ: ' + escapeHtml(e.message) + '</div>';
      }
    }

    async function start(uid){
      currentUid = uid;
      document.getElementById('checkingBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('listArea').style.display = 'block';
      setId('รหัสผู้ใช้ LINE ของคุณ: ' + uid);
      await loadAnnouncements();
    }

    /* ---------- LINE auth flow (mirrors existing modules) ---------- */
    function showLogin(showBtn){
      document.getElementById('checkingBox').style.display = 'none';
      document.getElementById('listArea').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('manualLoginBtn').style.display = showBtn ? 'block' : 'none';
    }
    function doManualLogin(){
      try { liff.login(); } catch (e) { setId('login ล้มเหลว: ' + (e && e.message ? e.message : e)); }
    }
    function useManualUid(){
      const input = document.getElementById('manualUidInput');
      const msgEl = document.getElementById('manualEntryMsg');
      const uid = input ? input.value.trim() : '';
      if (!uid) { if (msgEl) msgEl.textContent = 'กรุณาวางรหัสผู้ใช้ LINE ก่อน'; return; }
      start(uid).then(() => { if (msgEl) msgEl.textContent = 'เข้าสู่ระบบด้วยรหัสที่กรอกแล้ว'; });
    }
    async function tryLoadProfile(){
      try {
        const profile = await liff.getProfile();
        await start(profile.userId);
      } catch (e) {
        setId('getProfile ล้มเหลว: ' + (e && e.message ? e.message : JSON.stringify(e)));
        showLogin(true);
      }
    }

    (async function init(){
      let settled = false;
      const timeout = setTimeout(() => {
        if (!settled) { setId('หมดเวลารอ LIFF - ใช้ช่องกรอกรหัสด้วยตนเองแทนได้เลย'); showLogin(true); }
      }, 6000);

      if (typeof liff === 'undefined') {
        setId('LIFF SDK โหลดไม่สำเร็จ - ใช้ช่องกรอกรหัสด้วยตนเองแทนได้เลย');
        showLogin(true);
        return;
      }
      try {
        await liff.init({ liffId: LIFF_ID });
        settled = true;
        clearTimeout(timeout);
        let loggedIn = false;
        try { loggedIn = liff.isLoggedIn(); } catch (e0) {}
        if (!loggedIn) { showLogin(true); return; }
        await tryLoadProfile();
      } catch (e) {
        settled = true;
        clearTimeout(timeout);
        setId('LIFF init ล้มเหลว: ' + (e && e.message ? e.message : JSON.stringify(e)) + ' - ใช้ช่องกรอกรหัสด้วยตนเองแทนได้เลย');
        showLogin(true);
      }
    })();
  </script>
</body>
</html>
